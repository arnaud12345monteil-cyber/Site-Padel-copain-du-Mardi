<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de recettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE9DC;
    --card:#FBF8F1;
    --ink:#2A2420;
    --ink-soft:#6B6153;
    --line:#CFC5AE;
    --line-soft:#DFD8C6;
    --rust:#B5651D;
    --rust-dark:#8C4E15;
    --sage:#6B7F5E;
    --sage-dark:#3F4C36;
    --mustard:#C9962B;
    --mustard-dark:#7A5A17;
    --clay:#A65141;
    --clay-dark:#6B3226;
    --navy:#445266;
    --navy-dark:#2A3341;
    --danger:#A63A2E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:2.5rem 1.5rem 5rem;
    position:relative;
    z-index:1;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:1rem;
    margin-bottom:2rem;
    border-bottom:4px solid;
    border-image:linear-gradient(90deg, var(--sage), var(--mustard), var(--clay), var(--navy), var(--rust)) 1;
    padding-bottom:1.25rem;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:2.25rem;
    margin:0 0 0.25rem;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.95rem;
  }
  .sync-badge{
    font-family:'Space Mono',monospace;
    font-size:0.68rem;
    color:var(--sage-dark);
    display:flex;
    align-items:center;
    gap:0.35rem;
  }
  .sync-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--sage);
    display:inline-block;
  }
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    flex-wrap:wrap;
    margin-bottom:1.25rem;
  }
  .toolbar-left{
    display:flex;
    align-items:center;
    gap:0.9rem;
    flex-wrap:wrap;
  }
  .btn-primary{
    background:var(--rust);
    color:var(--card);
    border:none;
    padding:0.7rem 1.2rem;
    border-radius:6px;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:0.85rem;
    letter-spacing:0.02em;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-primary:hover{ background:var(--rust-dark); }
  .btn-primary:disabled{ opacity:0.6; cursor:default; }
  .search-input{
    flex:1;
    min-width:180px;
    max-width:280px;
    padding:0.6rem 0.8rem;
    border:1.5px solid var(--line);
    border-radius:6px;
    background:var(--card);
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    color:var(--ink);
  }
  .search-input:focus{ outline:2px solid var(--rust); outline-offset:1px; }
  .view-toggle{
    display:flex;
    border:1.5px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .view-btn{
    background:var(--card);
    border:none;
    padding:0.55rem 0.9rem;
    font-family:'Space Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .view-btn + .view-btn{ border-left:1.5px solid var(--line); }
  .view-btn.active{
    background:var(--rust);
    color:var(--card);
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:0.5rem;
    margin-bottom:2rem;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:0.4rem;
    padding:0.4rem 0.7rem 0.4rem 0.9rem;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-family:'Space Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    background:var(--rust);
    color:var(--card);
    border-color:var(--rust);
  }
  .chip .chip-x{
    opacity:0.55;
    font-size:0.85rem;
    line-height:1;
    margin-left:2px;
  }
  .chip .chip-x:hover{ opacity:1; color:var(--danger); }
  .chip .chip-edit{
    opacity:0.55;
    font-size:0.78rem;
    line-height:1;
  }
  .chip .chip-edit:hover{ opacity:1; color:var(--rust-dark); }
  .chip-add{
    border-style:dashed;
    background:transparent;
    color:var(--ink-soft);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:1.25rem;
  }
  .grid.view-stack{
    display:flex;
    flex-direction:column;
    gap:0.5rem;
  }
  .card{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:4px;
    padding:1.5rem 1.1rem 1.1rem;
  }
  .card::before,.card::after{
    content:"";
    position:absolute;
    top:-1px;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--paper);
    border:1.5px solid var(--line);
  }
  .card::before{ left:22px; }
  .card::after{ left:calc(100% - 34px); }
  .view-stack .card{
    padding:0.9rem 1.1rem;
  }
  .view-stack .card::before, .view-stack .card::after{ display:none; }
  .view-stack .card .card-head{
    display:flex;
    align-items:center;
    gap:0.7rem;
    cursor:pointer;
  }
  .view-stack .card .tab{ margin-bottom:0; flex-shrink:0; }
  .view-stack .card h3{ margin:0; font-size:1rem; }
  .view-stack .card .card-details{ display:none; margin-top:1rem; }
  .view-stack .card.expanded .card-details{ display:block; }
  .tab{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:0.68rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:0.2rem 0.55rem;
    border-radius:3px;
    margin-bottom:0.7rem;
  }
  .card h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0 0.2rem 0.6rem;
    line-height:1.3;
    padding-right:3.4rem;
  }
  .type-icon{
    display:inline-flex;
    vertical-align:middle;
    margin-left:0.4rem;
    position:relative;
    top:-1px;
  }
  .card .divider{
    border:none;
    border-top:1.5px dashed var(--line-soft);
    margin:0 0 0.9rem;
  }
  .embed-wrap{
    display:flex;
    justify-content:center;
    margin:0 0 0.9rem;
    min-height:120px;
  }
  .embed-wrap blockquote.instagram-media{
    margin:0 !important;
  }
  .card .notes{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0 0 1rem;
    line-height:1.5;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.5rem;
  }
  .ig-link{
    font-family:'Space Mono',monospace;
    font-size:0.78rem;
    color:var(--rust-dark);
    text-decoration:none;
    font-weight:700;
  }
  .ig-link:hover{ text-decoration:underline; }
  .card-actions{
    position:absolute;
    top:10px;
    right:12px;
    display:flex;
    gap:0.5rem;
    z-index:2;
    background:var(--card);
    padding:2px 4px;
    border-radius:4px;
  }
  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:0.95rem;
    padding:2px;
    line-height:1;
  }
  .icon-btn:hover{ color:var(--danger); }
  .card-date{
    font-family:'Space Mono',monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
    opacity:0.6;
    display:block;
    margin-bottom:0.6rem;
  }
  .empty{
    text-align:center;
    padding:4rem 1rem;
    color:var(--ink-soft);
  }
  .empty h2{
    font-family:'Fraunces',serif;
    font-size:1.4rem;
    color:var(--ink);
    margin:0 0 0.5rem;
  }
  .empty .btn-primary{ margin-top:1rem; }
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(42,36,32,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
    z-index:50;
  }
  .overlay.visible{
    display:flex;
  }
  .modal{
    background:var(--card);
    border-radius:6px;
    border:1.5px solid var(--line);
    max-width:460px;
    width:100%;
    max-height:90vh;
    overflow-y:auto;
    padding:1.75rem;
  }
  .modal h2{
    font-family:'Fraunces',serif;
    font-size:1.35rem;
    margin:0 0 1.2rem;
  }
  .field{ margin-bottom:1rem; }
  .field label{
    display:block;
    font-size:0.78rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:0.35rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:0.6rem 0.7rem;
    border:1.5px solid var(--line);
    border-radius:5px;
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--rust);
    outline-offset:1px;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field .hint{
    font-size:0.75rem;
    color:var(--ink-soft);
    margin-top:0.3rem;
  }
  .field .warn{
    font-size:0.75rem;
    color:var(--mustard-dark);
    margin-top:0.3rem;
  }
  .icon-picker{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:0.4rem;
    margin-top:0.5rem;
  }
  .icon-swatch{
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:5px;
    padding:0.4rem;
    cursor:pointer;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-swatch.selected{
    border-color:var(--rust);
    background:#F3E4D2;
    color:var(--rust-dark);
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:0.7rem;
    margin-top:1.4rem;
  }
  .btn-ghost{
    background:none;
    border:1.5px solid var(--line);
    padding:0.6rem 1rem;
    border-radius:5px;
    font-family:'Inter',sans-serif;
    font-size:0.85rem;
    cursor:pointer;
    color:var(--ink);
  }
  .btn-ghost:hover{ background:var(--paper); }
  .loading{
    text-align:center;
    padding:4rem 1rem;
    color:var(--ink-soft);
    font-family:'Space Mono',monospace;
    font-size:0.85rem;
  }
  .doodle{
    position:fixed;
    pointer-events:none;
    opacity:0.5;
    z-index:0;
  }
  @media (max-width: 1320px){
    .doodle{ display:none; }
  }
  .version-badge{
    position:fixed;
    top:10px;
    right:14px;
    font-family:'Space Mono',monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
    background:var(--card);
    border:1px solid var(--line);
    padding:0.15rem 0.55rem;
    border-radius:10px;
    z-index:40;
    opacity:0.85;
  }
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>Carnet de recettes</h1>
      <p>Tes recettes Instagram, rangées par type de plat.</p>
    </div>
  </header>

  <div id="loading" class="loading">Connexion à la base de données…</div>

  <div id="app" hidden>
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn-primary" id="add-recipe-btn">+ Nouvelle recette</button>
        <button class="btn-ghost" id="import-btn-open">Importer en masse</button>
        <div class="view-toggle">
          <button class="view-btn" data-view="grid" title="Vue grille">Grille</button>
          <button class="view-btn" data-view="stack" title="Vue empilée">Pile</button>
        </div>
        <span class="sync-badge"><span class="sync-dot"></span>Synchronisé sur Firestore</span>
      </div>
      <input type="text" class="search-input" id="search-input" placeholder="Rechercher un titre ou une note…">
    </div>
    <div class="chips" id="chips"></div>
    <div class="chips" id="account-chips" hidden></div>
    <div id="grid-container">
      <div class="grid" id="cards-grid"></div>
      <div class="empty" id="empty-state" hidden>
        <h2 id="empty-title"></h2>
        <p id="empty-desc"></p>
        <button class="btn-primary" id="empty-add-btn" hidden>+ Nouvelle recette</button>
      </div>
    </div>
  </div>
</div>

    return tagColors[idx % tagColors.length];
  }

  function isInstagramUrl(url){
    return !!url && url.toLowerCase().indexOf('instagram.com') !== -1;
  }

  var tagStyles = {
    sage:   { bg:'#DCE3D5', fg:'#3F4C36' },
    mustard:{ bg:'#F0DFB8', fg:'#7A5A17' },
    clay:   { bg:'#E8CFC8', fg:'#6B3226' },
    navy:   { bg:'#D6DBE3', fg:'#2A3341' },
    rust:   { bg:'#EAD2BC', fg:'#8C4E15' }
  };

  function checkLoaded(){
    if (loadedTypes && loadedRecipes && loadedAccounts){
      loadingEl.hidden = true;
      appEl.hidden = false;
    }
  }

  function initFirebase(){
    try{
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    }catch(e){
      loadingEl.textContent = 'Impossible de se connecter à la base de données : ' + e.message;
      return;
    }
    db.collection('types').onSnapshot(function(snapshot){
      state.types = snapshot.docs.map(function(d){
        var data = d.data();
        return { id:d.id, name:data.name, icon: data.icon || 'plat' };
      });
      loadedTypes = true;
      checkLoaded();
      render();
    }, function(err){
      loadingEl.hidden = false;
      appEl.hidden = true;
      loadingEl.textContent = 'Erreur de connexion : ' + err.message;
    });
    db.collection('accounts').onSnapshot(function(snapshot){
      state.accounts = snapshot.docs.map(function(d){
        var data = d.data();
        return { id:d.id, name:data.name };
      });
      loadedAccounts = true;
      checkLoaded();
      render();
    }, function(err){
      loadingEl.hidden = false;
      appEl.hidden = true;
      loadingEl.textContent = 'Erreur de connexion : ' + err.message;
    });
    db.collection('recipes').onSnapshot(function(snapshot){
      state.recipes = snapshot.docs.map(function(d){
        var data = d.data();
        var created = (data.createdAt && data.createdAt.toMillis) ? data.createdAt.toMillis() : (data.createdAt || Date.now());
        return { id:d.id, title:data.title, url:data.url, notes:data.notes, type:data.type || null, account:data.account || null, createdAt: created };
      });
      loadedRecipes = true;
      checkLoaded();
      render();
    }, function(err){
      loadingEl.hidden = false;
      appEl.hidden = true;
      loadingEl.textContent = 'Erreur de connexion : ' + err.message;
    });
  }

  function processInstagramEmbeds(){
    if (window.instgrm && window.instgrm.Embeds){
      window.instgrm.Embeds.process();
    } else {
      setTimeout(function(){
        if (window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();
      }, 600);
    }
  }

  function getTypeIcon(typeName){
    if (!typeName) return null;
    var t = state.types.find(function(x){ return x.name === typeName; });
    return t ? t.icon : null;
  }

  function typeIconHtml(typeName){
    var iconKey = getTypeIcon(typeName);
    if (!iconKey || !iconLibrary[iconKey]) return '';
    var fg = tagStyles[colorFor(typeName)].fg;
    return '<span class="type-icon" title="' + escapeHtml(typeName) + '" style="color:' + fg + ';">' +
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + iconLibrary[iconKey] + '</svg></span>';
  }

  function buildIconPickerHtml(selectedKey){
    var sel = selectedKey || 'plat';
    var html = '<div class="icon-picker" id="icon-picker">';
    Object.keys(iconLibrary).forEach(function(key){
      var isSel = key === sel ? ' selected' : '';
      html += '<button type="button" class="icon-swatch' + isSel + '" data-icon="' + key + '" title="' + key + '">' +
        '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + iconLibrary[key] + '</svg></button>';
    });
    html += '</div><input type="hidden" id="icon-picker-value" value="' + sel + '">';
    return html;
  }

  function bindIconPicker(){
    var picker = document.getElementById('icon-picker');
    var hidden = document.getElementById('icon-picker-value');
    if (!picker) return;
    picker.querySelectorAll('.icon-swatch').forEach(function(btn){
      btn.addEventListener('click', function(){
        picker.querySelectorAll('.icon-swatch').forEach(function(b){ b.classList.remove('selected'); });
        btn.classList.add('selected');
        hidden.value = btn.getAttribute('data-icon');
      });
    });
  }

  function render(){

    reconcileCards();

  function getKnownAccounts(){
    var set = {};
    state.accounts.forEach(function(a){ set[a.name] = true; });
    state.recipes.forEach(function(r){ if (r.account) set[r.account] = true; });
    return Object.keys(set).sort();
  }

  async function deleteAccountValue(name){
    if (!db) return;
    var affected = state.recipes.filter(function(r){ return r.account === name; });
    if (!confirm('Dissocier "' + name + '" de ' + affected.length + ' recette(s) ? Le compte ne sera plus assigné, mais les recettes resteront.')) return;
    try{
      var batch = db.batch();
      affected.forEach(function(r){
        batch.update(db.collection('recipes').doc(r.id), { account: null });
      });
      var accObj = state.accounts.find(function(a){ return a.name === name; });
      if (accObj) batch.delete(db.collection('accounts').doc(accObj.id));
      await batch.commit();
      if (filterAccount === name) filterAccount = null;
    }catch(e){
      alert('Erreur lors de la modification : ' + e.message);
    }
  }

  function computeSig(r){
    return [r.title, r.url, r.notes || '', r.type || '', r.account || ''].join('|');
  }

    var dateStr = new Date(r.createdAt).toLocaleDateString('fr-FR', { day:'2-digit', month:'short' });
    var embedHtml = '';
    if (isInstagramUrl(r.url)){
      embedHtml = '<div class="embed-wrap"><blockquote class="instagram-media" data-instgrm-permalink="' + escapeHtml(r.url) + '" data-instgrm-captioned data-instgrm-version="14" style="background:#FFF;border:0;border-radius:3px;margin:0;max-width:540px;min-width:300px;padding:0;width:100%;"></blockquote></div>';

    el.innerHTML =
      '<div class="card-actions">' +
      '<button class="icon-btn" data-action="edit" title="Modifier">✎</button>' +

  function ensureGridDiv(){
    if (!gridDiv){
      gridDiv = document.getElementById('cards-grid');
      gridDiv.addEventListener('click', function(e){

        if (btn){
          var cardEl = e.target.closest('.card');
          var id = cardEl && cardEl.dataset.id;
          if (!id) return;
          if (btn.getAttribute('data-action') === 'delete') deleteRecipe(id);
          if (btn.getAttribute('data-action') === 'edit') openEditRecipeModal(id);
          return;
        }
        var head = e.target.closest('.card-head');
        if (head){
          var parentCard = head.closest('.card');
          if (parentCard) parentCard.classList.toggle('expanded');
        }
      });
    }
    return gridDiv;
  }

  function reconcileCards(){
    var sortedAll = state.recipes.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
    var validIds = {};
    sortedAll.forEach(function(r){ validIds[r.id] = true; });

    Object.keys(cardCache).forEach(function(id){
      if (!validIds[id]){
        var oldEl = cardCache[id];
        if (oldEl.parentNode) oldEl.parentNode.removeChild(oldEl);
        delete cardCache[id];
      }
    });

    var grid = ensureGridDiv();
    var cursor = grid.firstChild;
    var needsProcess = false;

    sortedAll.forEach(function(r){
      var sig = computeSig(r);
      var el = cardCache[r.id];
      if (!el){
        el = buildCardElement(r);
        cardCache[r.id] = el;
        if (isInstagramUrl(r.url)) needsProcess = true;
      } else if (el.dataset.sig !== sig){
        var freshEl = buildCardElement(r);
        if (cursor === el) cursor = el.nextSibling;
        if (el.parentNode) el.parentNode.removeChild(el);
        cardCache[r.id] = freshEl;
        el = freshEl;
        if (isInstagramUrl(r.url)) needsProcess = true;
      }
      if (cursor !== el){
        grid.insertBefore(el, cursor);
      } else {
        cursor = cursor.nextSibling;
      }
    });

    if (needsProcess) processInstagramEmbeds();
    applyVisibility();
  }

  function applyVisibility(){
    var anyVisible = false;
    Object.keys(cardCache).forEach(function(id){
      var r = state.recipes.find(function(x){ return x.id === id; });
      if (!r){ cardCache[id].style.display = 'none'; return; }
      var visible = true;
      if (filterType !== null && r.type !== filterType) visible = false;
      if (visible && filterAccount !== null && r.account !== filterAccount) visible = false;
      if (visible && searchTerm){
        var t = (r.title + ' ' + (r.notes||'')).toLowerCase();
        if (t.indexOf(searchTerm.toLowerCase()) === -1) visible = false;
      }
      cardCache[id].style.display = visible ? '' : 'none';
      if (visible) anyVisible = true;
    });

    var emptyEl = document.getElementById('empty-state');
    var titleEl = document.getElementById('empty-title');
    var descEl = document.getElementById('empty-desc');
    var addBtn = document.getElementById('empty-add-btn');

    if (!anyVisible){
      emptyEl.hidden = false;
      if (state.recipes.length === 0){
        titleEl.textContent = 'Le carnet est vide';
        descEl.textContent = 'Ajoute ta première recette Instagram pour commencer.';
        addBtn.hidden = false;
      } else {
        titleEl.textContent = 'Rien ici';
        descEl.textContent = 'Aucune recette ne correspond à ce filtre.';
        addBtn.hidden = true;
      }
    } else {
      emptyEl.hidden = true;
    }
  }

    overlayEl.addEventListener('click', function(e){ if (e.target === overlayEl) closeModal(); });
    document.addEventListener('keydown', escCloseOnce);
    document.getElementById('save-type-btn').addEventListener('click', async function(){
      var name = document.getElementById('f-standalone-type-name').value.trim();
      if (!name){ alert('Indique un nom.'); return; }
      var icon = document.getElementById('icon-picker-value').value || 'plat';
      var btn = document.getElementById('save-type-btn');
      btn.disabled = true; btn.textContent = 'Création…';
      var ok = await addType(name, icon);
      if (ok){ closeModal(); }
      else { btn.disabled = false; btn.textContent = 'Créer'; }
    });
  }

  function extractImportEntries(text){
    var lines = text.split(/\r?\n/);
    var entries = [];
    var lineDateRegex = /^\s*[\u200e\u200f]?\[(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})\]/;
    var urlRegex = /https?:\/\/(www\.)?instagram\.com\/[^\s"'<>]+/g;
    lines.forEach(function(line){
      var urls = line.match(urlRegex);
      if (!urls) return;
      var ts = null;
      var m = line.match(lineDateRegex);
      if (m){
        var d = new Date(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10), parseInt(m[4],10), parseInt(m[5],10), parseInt(m[6],10));
        if (!isNaN(d.getTime())) ts = d.getTime();
      }
      urls.forEach(function(u){
        entries.push({ url: u.replace(/[.,)\]}'"]+$/, ''), ts: ts });
      });
    });
    return entries;
  }

  function openImportModal(){
    var typeOptions = state.types.map(function(t){
      return '<option value="' + escapeHtml(t.name) + '">' + escapeHtml(t.name) + '</option>';
    }).join('');

    modalEl.innerHTML =
      '<h2>Importer plusieurs recettes</h2>' +
      '<div class="field"><label for="import-file">Fichier texte (export de discussion, liste de liens…)</label>' +
      '<input type="file" id="import-file" accept=".txt">' +
      '<div class="hint">Ou colle directement le texte ci-dessous.</div>' +
      '<textarea id="import-text" style="min-height:150px;" placeholder="Colle ici le texte contenant des liens Instagram…"></textarea>' +
      '</div>' +
      '<div class="field"><label for="import-type">Type à assigner à toutes (optionnel)</label>' +
      '<select id="import-type"><option value="">— aucun —</option>' + typeOptions + '</select></div>' +
      '<div class="field"><label for="import-account">Compte Instagram à assigner à toutes (optionnel)</label>' +
      '<select id="import-account"><option value="">— aucun —</option>' +
      getKnownAccounts().map(function(a){ return '<option value="' + escapeHtml(a) + '">' + escapeHtml(a) + '</option>'; }).join('') +
      '<option value="__new__">+ Nouveau compte…</option></select>' +
      '<input type="text" id="import-account-new" placeholder="@nom_du_compte" style="margin-top:0.5rem;display:none;">' +
      '</div>' +
      '<div class="hint" id="import-preview"></div>' +
      '<div class="modal-actions">' +
      '<button class="btn-ghost" id="cancel-btn">Annuler</button>' +
      '<button class="btn-primary" id="do-import-btn">Analyser et importer</button>' +
      '</div>';

    overlayEl.classList.add('visible');
    document.getElementById('cancel-btn').addEventListener('click', closeModal);
    overlayEl.addEventListener('click', function(e){ if (e.target === overlayEl) closeModal(); });
    document.addEventListener('keydown', escCloseOnce);

    var fileInput = document.getElementById('import-file');
    var importAccountSelect = document.getElementById('import-account');
    var importAccountNewInput = document.getElementById('import-account-new');
    importAccountSelect.addEventListener('change', function(){
      importAccountNewInput.style.display = importAccountSelect.value === '__new__' ? 'block' : 'none';
    });
    var textArea = document.getElementById('import-text');
    var preview = document.getElementById('import-preview');

    fileInput.addEventListener('change', function(e){
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(evt){
        textArea.value = evt.target.result;
        updatePreview();
      };
      reader.readAsText(file);
    });

    function updatePreview(){
      var entries = extractImportEntries(textArea.value);
      var existingUrls = {};
      state.recipes.forEach(function(r){ existingUrls[r.url] = true; });
      var seen = {};
      var newCount = 0;
      var dupCount = 0;
      entries.forEach(function(en){
        if (seen[en.url]) return;
        seen[en.url] = true;
        if (existingUrls[en.url]) dupCount++; else newCount++;
      });
      if (entries.length === 0){
        preview.textContent = '';
      } else {
        preview.textContent = newCount + ' nouveau(x) lien(s) détecté(s)' + (dupCount > 0 ? ', ' + dupCount + ' déjà présent(s) et ignoré(s).' : '.');
      }
    }
    textArea.addEventListener('input', updatePreview);

    document.getElementById('do-import-btn').addEventListener('click', async function(){
      if (!db){ alert('Pas encore connecté à la base de données.'); return; }
      var entries = extractImportEntries(textArea.value);
      var existingUrls = {};
      state.recipes.forEach(function(r){ existingUrls[r.url] = true; });
      var seen = {};
      var toImport = [];
      entries.forEach(function(en){
        if (seen[en.url]) return;
        seen[en.url] = true;
        if (!existingUrls[en.url]) toImport.push(en);
      });

      if (toImport.length === 0){
        alert('Aucun nouveau lien Instagram trouvé dans ce texte.');
        return;
      }

      var typeVal = document.getElementById('import-type').value || null;
      var importAccSelVal = document.getElementById('import-account').value;
      var accountVal = importAccSelVal === '__new__'
        ? (document.getElementById('import-account-new').value.trim() || null)
        : (importAccSelVal || null);
      var btn = document.getElementById('do-import-btn');
      btn.disabled = true;
      btn.textContent = 'Import en cours…';

      try{
        var chunkSize = 400;
        var now = Date.now();
        for (var i = 0; i < toImport.length; i += chunkSize){
          var chunk = toImport.slice(i, i + chunkSize);
          var batch = db.batch();
          chunk.forEach(function(en, idx){
            var n = i + idx + 1;
            var ms = en.ts !== null ? en.ts : (now + n);
            var ref = db.collection('recipes').doc();
            batch.set(ref, {
              title: 'Recette importée ' + n,
              url: en.url,
              notes: '',
              type: typeVal,
              account: accountVal,
              createdAt: firebase.firestore.Timestamp.fromMillis(ms)
            });
          });
          await batch.commit();
        }
        alert(toImport.length + ' recette(s) importée(s) avec succès.');
        closeModal();
      }catch(e){
        alert('Erreur lors de l\'import : ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Analyser et importer';
      }
    });
  }

  function openRecipeModal(existing){
    var isEdit = !!existing;
    var typeOptions = state.types.map(function(t){
      var sel = existing && existing.type === t.name ? 'selected' : '';
      return '<option value="' + escapeHtml(t.name) + '" ' + sel + '>' + escapeHtml(t.name) + '</option>';
    }).join('');

    modalEl.innerHTML =
      '<h2>' + (isEdit ? 'Modifier la recette' : 'Nouvelle recette') + '</h2>' +
      '<div class="field"><label for="f-title">Titre</label>' +
      '<input type="text" id="f-title" placeholder="Ex. Bowl de saumon post-training" value="' + (existing ? escapeHtml(existing.title) : '') + '"></div>' +
      '<div class="field"><label for="f-url">Lien Instagram</label>' +
      '<input type="text" id="f-url" placeholder="https://www.instagram.com/reel/…" value="' + (existing ? escapeHtml(existing.url) : '') + '">' +
      '<div class="hint" id="url-hint"></div></div>' +
      '<div class="field"><label for="f-account">Compte Instagram (optionnel)</label>' +
      '<select id="f-account"><option value="">— aucun —</option>' +
      getKnownAccounts().map(function(a){
        var sel = existing && existing.account === a ? 'selected' : '';
        return '<option value="' + escapeHtml(a) + '" ' + sel + '>' + escapeHtml(a) + '</option>';
      }).join('') +
      '<option value="__new__">+ Nouveau compte…</option></select>' +
      '<input type="text" id="f-account-new" placeholder="@nom_du_compte" style="margin-top:0.5rem;display:none;">' +
      '</div>' +
      '<div class="field" id="type-field-wrap">' +
      '<label for="f-type">Type de plat</label>' +
      (state.types.length > 0
        ? '<select id="f-type"><option value="">— choisir —</option>' + typeOptions + '<option value="__new__">+ Nouveau type…</option></select>'
        : '<div class="hint">Aucun type pour l\'instant, crée-en un ci-dessous.</div>') +
      '<div id="new-type-section" style="margin-top:0.6rem;' + (state.types.length > 0 ? 'display:none;' : '') + '">' +
      '<input type="text" id="f-new-type-name" placeholder="Nom du type (ex. Apéro, Végé…)">' +
      buildIconPickerHtml('plat') +
      '</div>' +
      '</div>' +
      '<div class="field"><label for="f-notes">Notes (ingrédients, astuces…) — optionnel</label>' +
      '<textarea id="f-notes" placeholder="Ce que tu veux te rappeler de cette recette">' + (existing && existing.notes ? escapeHtml(existing.notes) : '') + '</textarea></div>' +
      '<div class="modal-actions">' +
      '<button class="btn-ghost" id="cancel-btn">Annuler</button>' +
      '<button class="btn-primary" id="save-btn">Enregistrer</button>' +
      '</div>';

    overlayEl.classList.add('visible');
    bindIconPicker();
    document.getElementById('f-title').focus();

    var typeSelect = document.getElementById('f-type');
    var newTypeSection = document.getElementById('new-type-section');
    if (typeSelect){
      typeSelect.addEventListener('change', function(){
        newTypeSection.style.display = typeSelect.value === '__new__' ? 'block' : 'none';
      });
    }

    var accountSelect = document.getElementById('f-account');
    var accountNewInput = document.getElementById('f-account-new');
    accountSelect.addEventListener('change', function(){
      accountNewInput.style.display = accountSelect.value === '__new__' ? 'block' : 'none';
    });

    var urlInput = document.getElementById('f-url');
    var urlHint = document.getElementById('url-hint');
    urlInput.addEventListener('input', function(){
      var v = urlInput.value.trim();
      if (v && v.indexOf('instagram.com') === -1){
        urlHint.className = 'warn';
        urlHint.textContent = 'Ce lien ne semble pas venir d\'Instagram — tu peux quand même l\'enregistrer, mais il n\'aura pas d\'aperçu.';
      } else {
        urlHint.textContent = '';
      }
    });

    document.getElementById('cancel-btn').addEventListener('click', closeModal);
    overlayEl.addEventListener('click', function(e){ if (e.target === overlayEl) closeModal(); });
    document.addEventListener('keydown', escCloseOnce);

    document.getElementById('save-btn').addEventListener('click', async function(){
      if (!db){ alert('Pas encore connecté à la base de données.'); return; }
      var title = document.getElementById('f-title').value.trim();
      var url = document.getElementById('f-url').value.trim();
      var notes = document.getElementById('f-notes').value.trim();
      var accSelVal = document.getElementById('f-account').value;
      var accountVal = accSelVal === '__new__'
        ? (document.getElementById('f-account-new').value.trim() || null)
        : (accSelVal || null);
      var chosenType = null;

      if (!title){ alert('Le titre est obligatoire.'); return; }
      if (!url){ alert('Le lien Instagram est obligatoire.'); return; }
      try{ new URL(url); }catch(e){ alert('Ce lien ne semble pas valide.'); return; }

      if (state.types.length === 0){
        var newName = document.getElementById('f-new-type-name').value.trim();
        if (!newName){ alert('Crée au moins un type de plat.'); return; }
        var iconVal = document.getElementById('icon-picker-value').value || 'plat';
        var okNew = await addType(newName, iconVal);
        if (!okNew) return;
        chosenType = newName;
      } else {
        var tv = typeSelect.value;
        if (tv === '__new__'){
          var nn = document.getElementById('f-new-type-name').value.trim();
          if (!nn){ alert('Indique un nom pour le nouveau type.'); return; }
          var iconVal2 = document.getElementById('icon-picker-value').value || 'plat';
          var okNn = await addType(nn, iconVal2);
          if (!okNn) return;
          chosenType = nn;
        } else if (tv){
          chosenType = tv;
        } else {
          alert('Choisis un type de plat.');
          return;
        }
      }

      var saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Enregistrement…';

      try{
        if (isEdit){
          await db.collection('recipes').doc(existing.id).update({ title: title, url: url, notes: notes, type: chosenType, account: accountVal });
        } else {
          await db.collection('recipes').add({ title: title, url: url, notes: notes, type: chosenType, account: accountVal, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        }
        closeModal();
      }catch(e){
        alert('Erreur lors de l\'enregistrement : ' + e.message);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Enregistrer';
      }
    });
  }

  function escCloseOnce(e){
    if (e.key === 'Escape') closeModal();
  }

  function closeModal(){
    overlayEl.classList.remove('visible');
    modalEl.innerHTML = '';
    document.removeEventListener('keydown', escCloseOnce);
  }

  document.getElementById('add-recipe-btn').addEventListener('click', openAddRecipeModal);
  document.getElementById('import-btn-open').addEventListener('click', openImportModal);
  document.getElementById('empty-add-btn').addEventListener('click', openAddRecipeModal);

  var searchDebounce = null;
  searchInput.addEventListener('input', function(){
    searchTerm = searchInput.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(applyVisibility, 250);
  });

  var viewMode = 'grid';
  try{
    var savedView = localStorage.getItem('recipe-catalog-view');
    if (savedView === 'grid' || savedView === 'stack') viewMode = savedView;
  }catch(e){}

  function applyViewMode(){
    var grid = ensureGridDiv();
    grid.classList.toggle('view-stack', viewMode === 'stack');
    document.querySelectorAll('.view-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-view') === viewMode);
    });
  }

  document.querySelectorAll('.view-btn').forEach(function(b){
    b.addEventListener('click', function(){
      viewMode = b.getAttribute('data-view');
      try{ localStorage.setItem('recipe-catalog-view', viewMode); }catch(e){}
      applyViewMode();
    });
  });
  applyViewMode();

  initFirebase();
})();
</script>
</body>
</html>
