<!--
  PALANQUÉE — suivi pédagogique de formation (N1)
  Prérequis Firebase (projet renseigné dans FIREBASE_CONFIG) :
   1. Authentication > Sign-in method : activer « Adresse e-mail/Mot de passe ».
   2. Authentication > Paramètres > Domaines autorisés : ajouter le domaine GitHub Pages.
   3. Firestore > Règles : coller le contenu de palanquee-firestore.rules.
  Sans projectId, l'appli tourne en mode démo (données dans le navigateur).
-->
<style>
:root{--bg:#f2f6f9;--card:#fff;--ink:#0f2233;--muted:#5b6f82;--line:#dbe4ec;--brand:#0b5d8a;--brand-d:#06324d;--chip:#e6f1f8;--ok:#1d8a4b;--warn:#b87300;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:linear-gradient(135deg,var(--brand-d),var(--brand));color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}

.ver{font-size:11px;font-weight:700;letter-spacing:.3px;background:rgba(255,255,255,.14);padding:4px 8px;border-radius:6px;opacity:.9;white-space:nowrap}

main{max-width:1000px;margin:0 auto;padding:16px 16px 40px}

.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-family:inherit}

.chip{display:inline-block;background:var(--chip);color:var(--brand);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0;font-weight:600}
.badge{display:inline-block;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;background:#eef2f5;color:var(--muted)}
.badge.ok{background:#e3f4ea;color:var(--ok)}.badge.warn{background:#fdf1dc;color:var(--warn)}.badge.bad{background:#fbe5e2;color:var(--bad)}

.modal-head{display:flex;align-items:center;margin-bottom:6px;gap:8px}

.stats div{background:var(--bg);border-radius:8px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:90vw;font-size:14px}
.toast.bad{background:var(--bad)}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script type="module">
/* ================= CONFIGURATION ================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAr7roHXWagY8LgDpn1mpLyUStpl4T4YMk",
  authDomain: "palanquee-c934c.firebaseapp.com",
  projectId: "palanquee-c934c",
  storageBucket: "palanquee-c934c.firebasestorage.app",
  messagingSenderId: "14173816618",
  appId: "1:14173816618:web:ce7a5abad27463b6f04053"
};
// Seule valeur à incrémenter à chaque mise en ligne (transmise au service worker).
const APP_VERSION = '2.1.0';

const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const EXCELJS_URL = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';

const LV = {
  ECA: {label: "En cours d'acquisition", cls: 'eca'},
  A:   {label: 'Acquis', cls: 'acq'},
  M:   {label: 'Maîtrisé', cls: 'mai'}
};
const LV_KEYS = ['ECA', 'A', 'M'];
const CRENEAUX = {H1: '1re heure', H2: '2e heure', FULL: 'Créneau complet'};
const CREN_RANK = {H1: 1, FULL: 2, H2: 3};
const DEFAULT_SEANCES = [...Array(12)].map((_, i) => ({key: 's' + (i + 1), label: 'Séance ' + (i + 1)}))
  .concat([{key: 'validation-mer', label: 'Validation Mer'}, {key: 'fosse', label: 'Fosse'}]);

/* ================= ÉTAT ================= */
const COLS = ['eleves', 'moniteurs', 'acces', 'competences', 'fiches', 'config'];
const DB = Object.fromEntries(COLS.map(c => [c, {}]));
const loaded = Object.fromEntries(COLS.map(c => [c, false]));
let backend, unsubData = null;
const S = {
  authReady: false, user: null, access: undefined, bootstrapExists: null, authMode: 'login',
  tab: 'fiches', view: null, fiche: null, eleveId: null, ficheScope: 'miens', showCm: {},
  q: '', progMode: 'seance', progKey: null, gTab: 'eleves',
  restore: null, importData: null, updateWorker: null
};

/* ================= OUTILS ================= */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const fmtDate = s => s ? new Date(s + 'T12:00').toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short', year:'numeric'}) : '—';
const fmtDateCourt = s => s ? new Date(s + 'T12:00').toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
const clean = o => { const c = {...o}; delete c.id; return c; };
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`]/g, "'").replace(/\s+/g, ' ').trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const personName = p => p ? `${p.prenom || ''} ${p.nom || ''}`.trim() : '(supprimé)';
const byName = (a, b) => (a.nom || '').localeCompare(b.nom || '', 'fr') || (a.prenom || '').localeCompare(b.prenom || '', 'fr');
const initialesDe = (prenom, nom) => ((prenom || '').split(/[\s-]+/).map(x => x[0] || '').join('') + (nom || '').split(/\s+/).map(x => x[0] || '').join('')).toUpperCase();

const isResp = () => S.access && S.access.role === 'responsable';
// Droits par moniteur, réglés par le responsable (absents = autorisé). Le responsable a toujours tous les droits.
const canCreate = () => isResp() || (!!S.access && S.access.peutCreer !== false);
const canEdit = () => isResp() || (!!S.access && S.access.peutModifier !== false);
const canEditFiche = f => isResp() || (f.moniteurId === myId() && canEdit());
const myId = () => S.access && S.access.moniteurId;
const eleves = all => Object.values(DB.eleves).filter(e => all || e.actif !== false).sort(byName);
const moniteurs = all => Object.values(DB.moniteurs).filter(m => all || m.actif !== false).sort(byName);
const monName = id => personName(DB.moniteurs[id]);
const prog = () => DB.config.programme || {};
const seances = () => (prog().seances && prog().seances.length) ? prog().seances : DEFAULT_SEANCES;
const seanceLabel = k => (seances().find(s => s.key === k) || {label: k || '?'}).label;
const seanceCourt = k => { const l = seanceLabel(k); const m = l.match(/^s[ée]ance\s*(\d+)/i); return m ? 'S' + m[1] : l; };
const comps = () => Object.values(DB.competences).sort((a, b) => (a.ordre ?? 999) - (b.ordre ?? 999) || (a.capacite || '').localeCompare(b.capacite || '', 'fr'));
const compName = c => c ? (c.capacite || '?').replace(/\s*\n\s*/g, ' ') : '(compétence supprimée)';
const gTitle = c => ((c && c.groupe) || 'Autres').split('\n')[0].trim();
const consigne = (cid, key) => ((prog().cells || {})[cid] || {})[key] || '';
const progComps = key => comps().filter(c => consigne(c.id, key)).map(c => c.id);
const ficheSort = (a, b) => (a.date || '').localeCompare(b.date || '') || (CREN_RANK[a.creneau] || 0) - (CREN_RANK[b.creneau] || 0) || (a.updatedAt || 0) - (b.updatedAt || 0);
const lvTag = k => k ? `<span class="lv ${LV[k].cls}" title="${esc(LV[k].label)}">${k}</span>` : '<span class="lv none">—</span>';

function groupedComps(list){
  const out = [];
  for (const c of list) {
    const g = gTitle(c);
    let grp = out.find(x => x.g === g);
    if (!grp) out.push(grp = {g, items: []});
    grp.items.push(c);
  }
  return out;
}

/* Agrège toutes les fiches d'un élève : présence, grille compétence × séance, historique. */
function bilan(eid){
  const fiches = Object.values(DB.fiches).filter(f => (f.eleves || []).includes(eid)).sort(ficheSort);
  const grid = {}, latest = {}, presence = new Set(), entries = [], notes = [];
  for (const f of fiches) {
    presence.add(f.seanceKey);
    const ev = (f.evals || {})[eid] || {};
    for (const cid of f.competences || []) {
      const e = ev[cid];
      if (!e || (!e.niveau && !e.comment)) continue;
      const it = {f, cid, niveau: e.niveau || '', comment: e.comment || ''};
      entries.push(it);
      if (it.niveau) { (grid[cid] = grid[cid] || {})[f.seanceKey] = it; latest[cid] = it; }
    }
    const g = (f.commentaires || {})[eid];
    if (g) notes.push({f, comment: g});
  }
  return {fiches, grid, latest, presence, entries, notes};
}
const presenceMoniteur = mid => new Set(Object.values(DB.fiches).filter(f => f.moniteurId === mid).map(f => f.seanceKey));

let toastT;
function toast(m, bad){
  const t = $('#toast'); t.textContent = m; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4000);
}
const ERR = {
  'auth/invalid-credential': 'E-mail ou mot de passe incorrect.',
  'auth/wrong-password': 'E-mail ou mot de passe incorrect.',
  'auth/user-not-found': 'Aucun compte avec cet e-mail. Utilise « Première connexion ».',
  'auth/invalid-email': 'Adresse e-mail invalide.',
  'auth/missing-password': 'Mot de passe manquant.',
  'auth/email-already-in-use': 'Un compte existe déjà avec cet e-mail : connecte-toi, ou utilise « Mot de passe oublié ».',
  'auth/weak-password': 'Mot de passe trop court (6 caractères minimum).',
  'auth/too-many-requests': 'Trop de tentatives. Réessaie dans quelques minutes.',
  'auth/network-request-failed': 'Pas de connexion réseau.',
  'auth/unauthorized-domain': 'Ce site n’est pas autorisé dans Firebase (Authentication > Paramètres > Domaines autorisés).',
  'auth/operation-not-allowed': 'La connexion par e-mail et mot de passe n’est pas activée dans Firebase.',
  'permission-denied': 'Accès refusé par les règles Firestore.'
};
const errMsg = e => ERR[e && e.code] || (e && e.message) || String(e);
async function run(fn){ try { await fn(); } catch (e) { console.error(e); toast(errMsg(e), true); } }

/* Écriture qui ne bloque pas l'écran si le réseau est absent (piscine en sous-sol…). */
async function saveSoft(promise){
  const r = await Promise.race([promise.then(() => 'ok'), new Promise(res => setTimeout(() => res('attente'), 4000))]);
  if (r === 'attente') {
    promise.catch(e => toast(errMsg(e), true));
    toast('Enregistré sur l’appareil. Envoi automatique dès le retour du réseau.');
    return false;
  }
  return true;
}

/* ================= BACKENDS ================= */
async function initBackend(){
  if (FIREBASE_CONFIG.projectId) {
    const { initializeApp } = await import(SDK + 'firebase-app.js');
    const fs = await import(SDK + 'firebase-firestore.js');
    const fa = await import(SDK + 'firebase-auth.js');
    const app = initializeApp(FIREBASE_CONFIG);
    let db;
    try { db = fs.initializeFirestore(app, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); }
    catch (e) { db = fs.getFirestore(app); }
    const auth = fa.getAuth(app);
    fa.useDeviceLanguage(auth);
    const me = u => u ? {email: (u.email || '').toLowerCase(), verified: !!u.emailVerified} : null;
    backend = {
      mode: 'firebase',
      onAuth: cb => fa.onAuthStateChanged(auth, u => cb(me(u))),
      signIn: (e, p) => fa.signInWithEmailAndPassword(auth, e.trim(), p),
      async signUp(e, p){ const c = await fa.createUserWithEmailAndPassword(auth, e.trim(), p); await fa.sendEmailVerification(c.user); },
      resetPassword: e => fa.sendPasswordResetEmail(auth, e.trim()),
      resendVerification: () => fa.sendEmailVerification(auth.currentUser),
      async refreshUser(){ await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); return me(auth.currentUser); },
      signOut: () => fa.signOut(auth),
      async getDoc(c, id){ const d = await fs.getDoc(fs.doc(db, c, id)); return d.exists() ? {id: d.id, ...d.data()} : null; },
      listen(cb){
        const uns = COLS.map(c => fs.onSnapshot(fs.collection(db, c), snap => {
          const o = {}; snap.forEach(d => o[d.id] = {id: d.id, ...d.data()});
          DB[c] = o; loaded[c] = true; cb();
        }, err => toast(errMsg(err), true)));
        return () => uns.forEach(u => u());
      },
      newId: c => fs.doc(fs.collection(db, c)).id,
      set: (c, id, data) => fs.setDoc(fs.doc(db, c, id), clean(data)),
      del: (c, id) => fs.deleteDoc(fs.doc(db, c, id)),
      async bulk(ops){
        for (let i = 0; i < ops.length; i += 400) {
          const b = fs.writeBatch(db);
          for (const o of ops.slice(i, i + 400)) {
            const ref = fs.doc(db, o.c, o.id);
            if (o.op === 'del') b.delete(ref); else b.set(ref, clean(o.data));
          }
          await b.commit();
        }
      }
    };
  } else {
    // Mode démo : tout reste dans le navigateur, mot de passe vérifié localement.
    const KEY = 'plq2_demo', UKEY = 'plq2_demo_user';
    let store; try { store = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    store = store || {}; COLS.forEach(c => store[c] = store[c] || {}); store.users = store.users || {};
    let dataCb = null, cur = localStorage.getItem(UKEY);
    const authCbs = [];
    const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
    const sync = () => {
      if (!dataCb) return;
      COLS.forEach(c => { DB[c] = {}; for (const [id, v] of Object.entries(store[c])) DB[c][id] = {id, ...clone(v)}; loaded[c] = true; });
      dataCb();
    };
    const commit = () => { persist(); sync(); };
    const fail = code => { const e = new Error(code); e.code = code; throw e; };
    const emit = () => authCbs.forEach(cb => cb(cur ? {email: cur, verified: true} : null));
    const login = e => { cur = e; localStorage.setItem(UKEY, e); emit(); };
    backend = {
      mode: 'local',
      onAuth(cb){ authCbs.push(cb); setTimeout(() => cb(cur ? {email: cur, verified: true} : null), 0); },
      async signIn(e, p){ e = e.trim().toLowerCase(); const u = store.users[e]; if (!u || u.p !== p) fail('auth/invalid-credential'); login(e); },
      async signUp(e, p){ e = e.trim().toLowerCase(); if (store.users[e]) fail('auth/email-already-in-use'); if ((p || '').length < 6) fail('auth/weak-password'); store.users[e] = {p}; persist(); login(e); },
      async resetPassword(){},
      async resendVerification(){},
      async refreshUser(){ return {email: cur, verified: true}; },
      async signOut(){ cur = null; localStorage.removeItem(UKEY); emit(); },
      async getDoc(c, id){ const v = store[c][id]; return v ? {id, ...clone(v)} : null; },
      listen(cb){ dataCb = cb; sync(); return () => { dataCb = null; }; },
      newId: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      async set(c, id, d){ store[c][id] = clean(clone(d)); commit(); },
      async del(c, id){ delete store[c][id]; commit(); },
      async bulk(ops){ for (const o of ops) { if (o.op === 'del') delete store[o.c][o.id]; else store[o.c][o.id] = clean(clone(o.data)); } commit(); }
    };
  }
}

/* ================= SESSION ================= */
async function onAuthChange(u){
  S.authReady = true; S.user = u; S.access = undefined; S.view = null; S.authMode = 'login';
  stopData();
  render();
  if (u && u.verified) await checkAccess();
}
async function checkAccess(){
  try {
    const a = await backend.getDoc('acces', S.user.email);
    if (a) { S.access = a; startData(); }
    else { S.access = null; S.bootstrapExists = !!(await backend.getDoc('config', 'bootstrap')); }
  } catch (e) {
    S.access = null; S.bootstrapExists = true; toast(errMsg(e), true);
  }
  render();
}
function startData(){ stopData(); unsubData = backend.listen(onData); }
function stopData(){
  if (unsubData) { unsubData(); unsubData = null; }
  COLS.forEach(c => { DB[c] = {}; loaded[c] = false; });
}
function onData(){
  if (loaded.acces && S.user) {
    const a = DB.acces[S.user.email];
    if (!a) { S.access = null; S.bootstrapExists = true; stopData(); render(); return; }
    S.access = a;
  }
  requestRender();
}

/* ================= RENDU ================= */
let pendingRender = false;
const typing = () => { const a = document.activeElement; return a && $('#app').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };
function requestRender(){
  if (typing()) { if (document.activeElement.id === 'q') { const l = $('#elist'); if (l) l.innerHTML = elevesListHtml(); return; } pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !typing()) { pendingRender = false; render(); } }, 0));

function render(){
  if (!backend) return;
  const formation = (DB.config.settings || {}).formation || 'Suivi pédagogique';
  const m = S.access && DB.moniteurs[S.access.moniteurId];
  $('#app').innerHTML = `
    <header>
      <div class="brand">Palanquée<small>${esc(formation)}</small></div>
      <span class="sp"></span>
      <div class="hgroup">
        ${canInstall() ? '<button type="button" class="hbtn" data-a="install">Installer</button>' : ''}
        ${S.user ? `<button type="button" class="hbtn" data-a="logout" title="${esc(S.user.email)}">${esc(m ? m.prenom : S.user.email)} · Déconnexion</button>` : ''}
      </div>
      <span class="ver" title="Version de l'application">v${APP_VERSION}</span>
    </header>
    ${S.updateWorker ? `<div class="update"><span>Une nouvelle version est disponible.</span><span class="sp"></span><button type="button" class="btn sm p" data-a="applyUpdate">Mettre à jour</button></div>` : ''}
    ${backend.mode === 'local' ? `<div class="demo"><b>Mode démo.</b> Les données restent dans ce navigateur (aucun e-mail n'est envoyé).</div>` : ''}
    <main>${mainView()}</main>`;
}

function mainView(){
  const wait = '<div class="card muted">Chargement…</div>';
  if (!S.authReady) return wait;
  if (!S.user) return authView();
  if (!S.user.verified) return verifyView();
  if (S.access === undefined) return wait;
  if (S.access === null) return noAccessView();
  if (!COLS.every(c => loaded[c])) return wait;
  if (S.view === 'fiche' && S.fiche) return ficheView();
  if (S.view === 'eleve' && DB.eleves[S.eleveId]) return eleveView(S.eleveId);
  const tabs = [['fiches', isResp() ? 'Fiches de séance' : 'Mes fiches'], ['eleves', 'Élèves'], ['presence', 'Présence'], ['programme', 'Programme']];
  if (isResp()) tabs.push(['gestion', 'Gestion']);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'fiches';
  return `<div class="tabs">${tabs.map(([k, l]) => `<button type="button" class="${S.tab === k ? 'on' : ''}" data-a="tab" data-v="${k}">${l}</button>`).join('')}</div>`
    + ({fiches: tabFiches, eleves: tabEleves, presence: tabPresence, programme: tabProgramme, gestion: tabGestion}[S.tab])();
}

const seg = (action, list, cur) => `<div class="seg2">${list.map(([v, l]) => `<button type="button" class="${cur === v ? 'on' : ''}" data-a="${action}" data-v="${v}">${l}</button>`).join('')}</div>`;

/* ---------- FICHES ---------- */
function draftKey(){ return 'plq2_draft_' + (S.user ? S.user.email : ''); }
function saveDraft(){ try { localStorage.setItem(draftKey(), JSON.stringify(S.fiche)); } catch (e) {} }
function readDraft(){ try { return JSON.parse(localStorage.getItem(draftKey())); } catch (e) { return null; } }
function dropDraft(){ try { localStorage.removeItem(draftKey()); } catch (e) {} }

function tabFiches(){
  const all = isResp() && S.ficheScope === 'toutes';
  const list = Object.values(DB.fiches).filter(f => all || f.moniteurId === myId()).sort(ficheSort).reverse();
  const draft = readDraft();
  let html = `<div class="row mb">${canCreate() ? '<button type="button" class="btn p" data-a="newFiche">+ Nouvelle fiche de séance</button>' : ''}<span class="sp"></span>
    ${isResp() ? seg('ficheScope', [['miens', 'Mes fiches'], ['toutes', 'Toutes']], S.ficheScope) : ''}</div>`;
  const rights = [!canCreate() && 'créer une fiche', !canEdit() && 'modifier tes fiches'].filter(Boolean);
  if (rights.length) html += `<div class="card muted">Le responsable de la formation ne t’a pas autorisé à ${rights.join(' ni à ')}. Contacte-le si besoin.</div>`;
  if (draft && (draft.id ? canEdit() : canCreate())) html += `<div class="card" style="border-color:#efd48b;background:#fffaf0"><div class="row"><div><b>Fiche non enregistrée</b>
      <div class="muted">${esc(seanceLabel(draft.seanceKey))} · ${fmtDate(draft.date)} · ${(draft.eleves || []).length} élève(s)</div></div><span class="sp"></span>
      <button type="button" class="btn sm" data-a="dropDraft">Abandonner</button><button type="button" class="btn sm p" data-a="resumeDraft">Reprendre</button></div></div>`;
  if (!comps().length) html += `<div class="card muted">Le référentiel de compétences est vide. ${isResp() ? 'Importe le fichier Excel de suivi dans Gestion &gt; Données.' : 'Le responsable de la formation doit d’abord l’importer.'}</div>`;
  if (!list.length) return html + '<div class="card muted">Aucune fiche pour l’instant.</div>';
  return html + list.map(f => {
    const nbEv = Object.values(f.evals || {}).reduce((n, ev) => n + Object.values(ev).filter(x => x.niveau).length, 0);
    return `<div class="card tight"><div class="row"><div>
      <b>${esc(seanceLabel(f.seanceKey))}</b> <span class="muted">· ${fmtDate(f.date)} · ${CRENEAUX[f.creneau] || ''}</span>
      ${all ? `<div class="muted">Moniteur : ${esc(monName(f.moniteurId))}</div>` : ''}
      <div class="muted">${(f.eleves || []).map(id => esc(personName(DB.eleves[id]))).join(', ') || 'Aucun élève'}</div>
      <div class="muted">${(f.competences || []).length} compétence(s) · ${nbEv} évaluation(s)</div></div><span class="sp"></span>
      ${canEditFiche(f) ? `<button type="button" class="btn sm" data-a="editFiche" data-id="${f.id}">Modifier</button>` : '<span class="badge">Lecture seule</span>'}</div></div>`;
  }).join('');
}

function nextSeanceKey(){
  const all = Object.values(DB.fiches).sort(ficheSort);
  const last = all[all.length - 1], keys = seances().map(s => s.key);
  if (!last) return keys[0];
  if (last.date === today()) return last.seanceKey;
  const i = keys.indexOf(last.seanceKey);
  return keys[Math.min(i + 1, keys.length - 1)] || keys[0];
}
function newFiche(){
  S.fiche = {id: null, date: today(), seanceKey: nextSeanceKey(), creneau: 'FULL', moniteurId: myId(), mode: 'programme', eleves: [], competences: [], evals: {}, commentaires: {}};
  S.fiche.competences = progComps(S.fiche.seanceKey);
  S.showCm = {}; S.view = 'fiche'; saveDraft(); render(); scrollTo(0, 0);
}
function ficheRows(){
  const f = S.fiche;
  const base = f.mode === 'programme' ? progComps(f.seanceKey) : [];
  return [...base, ...f.competences.filter(c => !base.includes(c))];
}
const overlap = (a, b) => a === 'FULL' || b === 'FULL' || a === b;
function takenBy(){
  const f = S.fiche, m = {};
  for (const o of Object.values(DB.fiches)) {
    if (o.id === f.id || o.moniteurId === f.moniteurId || o.date !== f.date || o.seanceKey !== f.seanceKey || !overlap(o.creneau, f.creneau)) continue;
    for (const e of o.eleves || []) (m[e] = m[e] || []).push((DB.moniteurs[o.moniteurId] || {}).initiales || '?');
  }
  return m;
}
function compOptions(exclude, first){
  return `<option value="">${first}</option>` + groupedComps(comps().filter(c => !exclude.includes(c.id)))
    .map(g => `<optgroup label="${esc(g.g)}">${g.items.map(c => `<option value="${c.id}">${esc(compName(c))}</option>`).join('')}</optgroup>`).join('');
}

    <div class="mt">${rows.length ? rows.map(cid => { const c = DB.competences[cid]; const cons = consigne(cid, f.seanceKey);

      : `<p class="muted">${f.mode === 'programme' ? 'Rien n’est prévu au programme pour cette séance.' : 'Ajoute les compétences travaillées.'}</p>`}</div>

/* ---------- ÉLÈVES ---------- */
function tabEleves(){

/* ================= EXCEL ================= */
let excelP;
function loadExcel(){
  return excelP = excelP || new Promise((res, rej) => {
    if (window.ExcelJS) return res(window.ExcelJS);
    const s = document.createElement('script'); s.src = EXCELJS_URL;
    s.onload = () => res(window.ExcelJS);
    s.onerror = () => { excelP = null; rej(new Error('Impossible de charger le module Excel (connexion réseau ?)')); };
    document.head.appendChild(s);
  });
}
function cellText(v){
  if (v == null) return '';
  if (v instanceof Date) return ymd(v);
  if (typeof v === 'object') {
    if (v.richText) return v.richText.map(t => t.text).join('').replace(/\r/g, '').trim();
    if (v.text != null) return String(v.text).trim();
    if (v.result != null) return String(v.result).trim();
    return '';
  }
  return String(v).replace(/\r/g, '').trim();
}
function splitName(full){
  const w = full.replace(/\s+/g, ' ').trim().split(' ');
  const isUp = x => /[A-ZÀ-Ý]/.test(x) && x === x.toUpperCase();
  const up = w.filter(isUp), lo = w.filter(x => !isUp(x));
  if (up.length && lo.length) return {prenom: lo.join(' '), nom: up.join(' ')};
  return {prenom: w.slice(0, -1).join(' ') || w[0], nom: w.length > 1 ? w[w.length - 1] : ''};
}
function parseProgramme(ws){
  let hr = null;
  for (let r = 1; r <= Math.min(20, ws.rowCount) && !hr; r++)
    ws.getRow(r).eachCell((c) => { if (norm(cellText(c.value)).startsWith('capacite')) hr = r; });
  if (!hr) throw new Error('Onglet Programme : ligne d’en-tête (Capacité…) introuvable.');
  const head = {};
  ws.getRow(hr).eachCell((c, col) => {
    const t = norm(cellText(c.value));
    if (t.startsWith('aptitude')) head.aptitude = col;
    else if (t.startsWith('competence')) head.groupe = col;
    else if (t.startsWith('type')) head.type = col;
    else if (t.startsWith('capacite')) head.capacite = col;
    else if (t.startsWith('mft')) head.mft = col;
    else if (t.startsWith('action')) head.action = col;
    else if (t.includes('realisation')) head.cr = col;
    else if (t.includes("d'evaluation")) head.ce = col;
  });
  const startCol = Math.max(...Object.values(head)) + 1;
  const seances = [];
  ws.getRow(hr - 1).eachCell((c, col) => {
    if (col < startCol) return;
    const label = cellText(c.value).replace(/\s+/g, ' ').trim();
    if (!label) return;
    const m = label.match(/^s[ée]ances?\s*(\d+)/i);
    const key = m ? 's' + m[1] : slug(label);
    if (!seances.some(s => s.key === key)) seances.push({key, label: m ? 'Séance ' + m[1] : label, col});
  });
  if (!seances.length) throw new Error('Onglet Programme : aucune colonne de séance trouvée.');
  const comps = [], theorie = {};
  let apt = '', grp = '', ordre = 0;
  for (let r = hr + 1; r <= ws.rowCount; r++) {
    const row = ws.getRow(r);
    const g = col => col ? cellText(row.getCell(col).value) : '';
    const cap = g(head.capacite);
    if (!cap) {
      let before = ''; for (let c = 1; c < startCol; c++) before += ' ' + cellText(row.getCell(c).value);
      if (/th[ée]orie/i.test(before)) seances.forEach(s => { const t = cellText(row.getCell(s.col).value); if (t) theorie[s.key] = t; });
      continue;
    }
    if (g(head.aptitude)) apt = g(head.aptitude);
    if (g(head.groupe)) grp = g(head.groupe);
    const cells = {};
    seances.forEach(s => { const t = cellText(row.getCell(s.col).value); if (t) cells[s.key] = t; });
    comps.push({aptitude: apt, groupe: grp, type: g(head.type), capacite: cap, mft: g(head.mft), action: g(head.action), cr: g(head.cr), ce: g(head.ce), ordre: ordre++, cells});
  }
  return {seances: seances.map(({key, label}) => ({key, label})), comps, theorie};
}
function parsePresence(ws){
  const out = {eleves: [], moniteurs: []}; let mode = null;
  for (let r = 1; r <= ws.rowCount; r++) {
    const a = cellText(ws.getRow(r).getCell(1).value), b = cellText(ws.getRow(r).getCell(2).value);
    if (!a) continue;
    const n = norm(a);
    if (n.startsWith('eleve')) { mode = 'eleves'; continue; }
    if (n.startsWith('moniteur')) { mode = 'moniteurs'; continue; }
    if (!mode) continue;
    out[mode].push({...splitName(a), initiales: b});
  }
  return out;
}
async function readXlsx(file){
  const ExcelJS = await loadExcel();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await file.arrayBuffer());
  const wsP = wb.worksheets.find(w => norm(w.name).startsWith('programme'));
  const wsR = wb.worksheets.find(w => norm(w.name).includes('presence'));
  if (!wsP && !wsR) throw new Error('Onglets « Programme » et « Présence séance » introuvables dans ce fichier.');
  const data = {name: file.name, prog: wsP ? parseProgramme(wsP) : null, pres: wsR ? parsePresence(wsR) : {eleves: [], moniteurs: []}};
  S.importData = data;
  const known = (list, arr) => arr.filter(p => !list.some(x => norm(personName(x)) === norm(personName(p)))).length;
  const newE = known(Object.values(DB.eleves), data.pres.eleves), newM = known(Object.values(DB.moniteurs), data.pres.moniteurs);
  openModal(`<div class="modal-head"><h2>Importer ${esc(file.name)}</h2><span class="sp"></span><button type="button" class="btn sm" data-a="closeModal">Fermer</button></div>
    <form data-f="applyImport">
      ${data.prog ? `<label class="inline"><input type="checkbox" name="prog" checked> Référentiel et programme : ${data.prog.comps.length} compétences, ${data.prog.seances.length} séances (${data.prog.seances.map(s => esc(s.label)).join(', ')})</label>

function sheetName(base, used){
  let n = base.replace(/[\\\/\?\*\[\]:]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 31) || 'Élève';
  let i = 2; const root = n;
  while (used.has(n.toLowerCase())) n = root.slice(0, 27) + ' (' + i++ + ')';
  used.add(n.toLowerCase());
  return n;
}
async function exportXlsx(){
  toast('Préparation du fichier Excel…');
  const ExcelJS = await loadExcel();
  const wb = new ExcelJS.Workbook(); wb.creator = 'Palanquée'; wb.created = new Date();
  const SE = seances(), C = comps(), formation = (DB.config.settings || {}).formation || 'Formation';
  const line = {style: 'thin', color: {argb: 'FFC9D6E2'}};
  const border = {top: line, left: line, bottom: line, right: line};
  const FILL = {ECA: 'FFFDE3A7', A: 'FFCFE5F7', M: 'FFC9EBD6'};
  const fill = argb => ({type: 'pattern', pattern: 'solid', fgColor: {argb}});
  const styleHead = row => row.eachCell(c => { c.fill = fill('FF0B5D8A'); c.font = {bold: true, color: {argb: 'FFFFFFFF'}}; c.alignment = {wrapText: true, vertical: 'middle', horizontal: 'center'}; c.border = border; });
  const styleBody = (row, from) => row.eachCell({includeEmpty: true}, (c, col) => { c.border = border; c.alignment = {wrapText: true, vertical: 'top', horizontal: col >= from ? 'center' : 'left'}; });
  const ref = c => [c.aptitude || '', c.groupe || '', c.type || '', c.capacite || '', c.mft || '', c.action || '', c.cr || '', c.ce || ''];
  const refCols = [['Aptitude', 16], ['Compétence', 26], ['Type', 12], ['Capacité', 24], ['MFT (extraits)', 30], ['Action', 30], ['Critères de réalisation (CR)', 30], ["Critères d'évaluation (CE)", 30]];

  // Onglet Programme
  const wp = wb.addWorksheet('Programme', {views: [{state: 'frozen', xSplit: 4, ySplit: 1}]});
  wp.columns = [...refCols.map(([header, width]) => ({header, width})), ...SE.map(s => ({header: s.label, width: 24}))];
  styleHead(wp.getRow(1));
  C.forEach(c => styleBody(wp.addRow([...ref(c), ...SE.map(s => consigne(c.id, s.key))]), 99));
  const theo = prog().theorie || {};
  if (Object.keys(theo).length) { const r = wp.addRow(['', '', '', 'Théorie', '', '', '', '', ...SE.map(s => theo[s.key] || '')]); styleBody(r, 99); r.font = {italic: true}; }

  // Onglet Présence séance
  const pr = wb.addWorksheet('Présence séance', {views: [{state: 'frozen', xSplit: 2, ySplit: 1}]});
  pr.columns = [{header: 'Élèves', width: 28}, {header: 'Initiales', width: 9}, ...SE.map(s => ({header: s.label, width: 11})), {header: 'Total', width: 8}];
  styleHead(pr.getRow(1));
  const presRow = (p, set) => styleBody(pr.addRow([personName(p), p.initiales || '', ...SE.map(s => set.has(s.key) ? 'X' : ''), set.size]), 3);
  eleves(true).forEach(e => presRow(e, bilan(e.id).presence));
  pr.addRow([]);
  const mh = pr.addRow(['Moniteurs', 'Initiales', ...SE.map(s => s.label), 'Total']); styleHead(mh);
  moniteurs(true).forEach(m => presRow(m, presenceMoniteur(m.id)));

  // Un onglet par élève
  const used = new Set(['programme', 'présence séance']);
  for (const e of eleves(true)) {
    const b = bilan(e.id);
    const ws = wb.addWorksheet(sheetName(personName(e), used), {views: [{state: 'frozen', xSplit: 3, ySplit: 3}]});
    ws.columns = [{width: 26}, {width: 12}, {width: 26}, {width: 26}, {width: 26}, {width: 26}, {width: 26}, ...SE.map(() => ({width: 11}))];
    const last = 7 + SE.length;
    const t = ws.addRow([`${personName(e)} — ${formation} — présent à ${b.presence.size} séance(s) sur ${SE.length}`]);
    t.font = {bold: true, size: 14}; ws.mergeCells(1, 1, 1, last);
    const lg = ws.addRow(['ECA = En cours d’acquisition · A = Acquis · M = Maîtrisé. Le moniteur et son commentaire figurent en note sur chaque cellule et dans le détail en bas de l’onglet.']);
    lg.font = {italic: true, color: {argb: 'FF5B6F82'}}; ws.mergeCells(2, 1, 2, last);
    styleHead(ws.addRow(['Compétence', 'Type', 'Capacité', 'MFT (extraits)', 'Action', 'Critères de réalisation (CR)', "Critères d'évaluation (CE)", ...SE.map(s => s.label)]));
    for (const c of C) {
      const row = ws.addRow([c.groupe || '', c.type || '', c.capacite || '', c.mft || '', c.action || '', c.cr || '', c.ce || '', ...SE.map(s => ((b.grid[c.id] || {})[s.key] || {}).niveau || '')]);
      styleBody(row, 8);
      SE.forEach((s, i) => {
        const it = (b.grid[c.id] || {})[s.key]; if (!it) return;
        const cell = row.getCell(8 + i);
        cell.fill = fill(FILL[it.niveau]); cell.font = {bold: true};
        cell.note = `${monName(it.f.moniteurId)} — ${fmtDateCourt(it.f.date)} (${CRENEAUX[it.f.creneau] || ''})${it.comment ? '\n' + it.comment : ''}`;
      });
    }
    ws.addRow([]);
    const dt = ws.addRow(['Détail des séances']); dt.font = {bold: true, size: 12};
    styleHead(ws.addRow(['Séance', 'Date', 'Créneau', 'Moniteur', 'Compétence', 'Niveau', 'Commentaire']));
    for (const f of b.fiches) {
      const ev = (f.evals || {})[e.id] || {}, base = [seanceLabel(f.seanceKey), fmtDateCourt(f.date), CRENEAUX[f.creneau] || '', monName(f.moniteurId)];
      let any = false;
      for (const cid of f.competences || []) {
        const x = ev[cid]; if (!x || (!x.niveau && !x.comment)) continue; any = true;
        const r = ws.addRow([...base, compName(DB.competences[cid]), x.niveau ? `${x.niveau} (${LV[x.niveau].label})` : '', x.comment || '']);
        styleBody(r, 99); if (x.niveau) r.getCell(6).fill = fill(FILL[x.niveau]);
      }
      const g = (f.commentaires || {})[e.id];
      if (g) { any = true; const r = ws.addRow([...base, 'Commentaire général', '', g]); styleBody(r, 99); r.getCell(5).font = {italic: true}; }
      if (!any) styleBody(ws.addRow([...base, 'Présent, aucune évaluation saisie', '', '']), 99);
    }
  }
  const buf = await wb.xlsx.writeBuffer();
  download(new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `Suivi_Peda_${slug(formation) || 'formation'}_${today()}.xlsx`);
  toast('Fichier Excel téléchargé');
}

/* ================= SAUVEGARDE JSON ================= */
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
const stamp = () => { const d = new Date(); return `${ymd(d)}-${String(d.getHours()).padStart(2, '0')}h${String(d.getMinutes()).padStart(2, '0')}`; };
function snapshot(){
  const data = {};
  for (const c of COLS) data[c] = Object.fromEntries(Object.entries(DB[c]).filter(([id]) => !(c === 'config' && id === 'bootstrap')).map(([id, v]) => [id, clean(v)]));
  return {app: 'palanquee', format: 2, version: APP_VERSION, exportedAt: new Date().toISOString(), data};
}
const downloadJson = (obj, name) => download(new Blob([JSON.stringify(obj, null, 2)], {type: 'application/json'}), name);
async function readJson(file){
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { throw new Error('Fichier illisible : ce n’est pas un JSON valide.'); }
  if (!d || d.app !== 'palanquee' || d.format !== 2 || !d.data) throw new Error('Ce fichier n’est pas une sauvegarde Palanquée v2.');
  COLS.forEach(c => { if (!d.data[c] || typeof d.data[c] !== 'object') d.data[c] = {}; });
  S.restore = d;
  const n = c => Object.keys(d.data[c]).length, cur = c => Object.keys(DB[c]).length;
  openModal(`<div class="modal-head"><h2>Restaurer une sauvegarde</h2><span class="sp"></span><button type="button" class="btn sm" data-a="closeModal">Fermer</button></div>
    <p class="muted">${esc(file.name)} · ${new Date(d.exportedAt).toLocaleString('fr-FR', {dateStyle: 'long', timeStyle: 'short'})} · v${esc(d.version)}</p>
    <div class="stats"><div><b>${n('eleves')}</b><span class="muted">élèves (${cur('eleves')} actuellement)</span></div><div><b>${n('fiches')}</b><span class="muted">fiches (${cur('fiches')})</span></div><div><b>${n('competences')}</b><span class="muted">compétences (${cur('competences')})</span></div></div>
    <p><b>Fusionner</b> : ajoute le contenu du fichier et remplace les éléments identiques. Rien n’est supprimé.</p>
    <p><b>Remplacer tout</b> : la base redevient exactement le fichier (ton propre accès est conservé). Une sauvegarde de l’état actuel est téléchargée juste avant.</p>
    <div class="row mt"><button type="button" class="btn" data-a="closeModal">Annuler</button><span class="sp"></span>
      <button type="button" class="btn d" data-a="restoreReplace">Remplacer tout</button><button type="button" class="btn p" data-a="restoreMerge">Fusionner</button></div>`);
}
async function applyRestore(replace){
  const d = S.restore; if (!d) return;
  if (replace && !confirm('Tout ce qui n’est pas dans le fichier sera supprimé. Continuer ?')) return;
  if (replace) downloadJson(snapshot(), `palanquee-avant-restauration-${stamp()}.json`);
  const ops = [], keep = (c, id) => (c === 'acces' && id === S.user.email) || (c === 'config' && id === 'bootstrap');
  for (const c of COLS) {
    if (replace) for (const id of Object.keys(DB[c])) if (!(id in d.data[c]) && !keep(c, id)) ops.push({op: 'del', c, id});
    for (const [id, v] of Object.entries(d.data[c])) if (!keep(c, id)) ops.push({op: 'set', c, id, data: v});
  }
  await backend.bulk(ops);
  closeModal();
  toast(`Restauration terminée (${ops.filter(o => o.op === 'set').length} éléments${replace ? ', ' + ops.filter(o => o.op === 'del').length + ' supprimés' : ''})`);
}

    const id = f.id.value || backend.newId('moniteurs'), old = DB.moniteurs[id] || {};
    const prenom = f.prenom.value.trim(), nom = f.nom.value.trim(), email = f.email.value.trim().toLowerCase();
    const self = id === myId();
    const actif = self ? true : f.actif.checked;
    const role = self ? 'responsable' : (f.resp.checked ? 'responsable' : 'moniteur');
    if (email && Object.values(DB.moniteurs).some(m => m.id !== id && (m.email || '').toLowerCase() === email)) return toast('Cet e-mail est déjà utilisé par un autre moniteur', true);
    if (self && email !== (old.email || '').toLowerCase()) return toast('Tu ne peux pas changer ton propre e-mail de connexion ici', true);
    const peutCreer = f.peutCreer.checked, peutModifier = f.peutModifier.checked;
    const ops = [{op: 'set', c: 'moniteurs', id, data: {...clean(old), prenom, nom, initiales: f.initiales.value.trim() || initialesDe(prenom, nom), email, actif, peutCreer, peutModifier}}];
    const oldEmail = (old.email || '').toLowerCase();
    if (oldEmail && oldEmail !== email && DB.acces[oldEmail]) ops.push({op: 'del', c: 'acces', id: oldEmail});
    if (email && actif) ops.push({op: 'set', c: 'acces', id: email, data: {moniteurId: id, role, peutCreer, peutModifier}});
    else if (email && DB.acces[email]) ops.push({op: 'del', c: 'acces', id: email});
    await backend.bulk(ops); closeModal(); toast('Moniteur enregistré');
  },
  saveComp: async f => {
    const id = f.id.value || backend.newId('competences');
    const v = k => f[k].value.trim();
    await backend.set('competences', id, {aptitude: v('aptitude'), groupe: v('groupe'), type: v('type'), capacite: v('capacite'), mft: v('mft'), action: v('action'), cr: v('cr'), ce: v('ce'), ordre: Number(f.ordre.value) || 0});
    closeModal(); toast('Compétence enregistrée');
  },
  saveCell: async f => { const cells = clone(prog().cells || {}); (cells[f.cid.value] = cells[f.cid.value] || {})[f.k.value] = f.txt.value.trim() || 'À travailler'; await saveProg({cells}); closeModal(); },
  seAdd: async f => {
    const label = f.label.value.trim(); let key = slug(label) || 'seance', i = 2;
    const m = label.match(/^s[ée]ance\s*(\d+)$/i); if (m) key = 's' + m[1];
    while (seances().some(s => s.key === key)) key = (slug(label) || 'seance') + '-' + i++;
    await saveProg({seances: [...seances(), {key, label}]});
  },
  applyImport: async f => {
    const d = S.importData; if (!d) return;
    const ops = [];
    if (d.prog && f.prog && f.prog.checked) {
      const known = {}; Object.values(DB.competences).forEach(c => known[norm(c.capacite)] = c.id);
      const cells = {};
      for (const c of d.prog.comps) {
        const {cells: cc, ...rest} = c, id = known[norm(c.capacite)] || backend.newId('competences');
        known[norm(c.capacite)] = id;
        ops.push({op: 'set', c: 'competences', id, data: rest});
        if (Object.keys(cc).length) cells[id] = cc;
      }
      ops.push({op: 'set', c: 'config', id: 'programme', data: {seances: d.prog.seances, cells, theorie: d.prog.theorie}});
    }
    const addPeople = (col, list) => {
      const names = new Set(Object.values(DB[col]).map(p => norm(personName(p))));
      for (const p of list) if (!names.has(norm(personName(p)))) {
        names.add(norm(personName(p)));
        ops.push({op: 'set', c: col, id: backend.newId(col), data: {...p, initiales: p.initiales || initialesDe(p.prenom, p.nom), actif: true, ...(col === 'moniteurs' ? {email: ''} : {})}});
      }
    };
    if (f.eleves.checked) addPeople('eleves', d.pres.eleves);
    if (f.moniteurs.checked) addPeople('moniteurs', d.pres.moniteurs);
    if (!ops.length) return toast('Rien à importer', true);
    await backend.bulk(ops); closeModal(); toast(`Import terminé (${ops.length} éléments)`);
  }
};

/* ================= ÉVÉNEMENTS ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  if (t.dataset.a === 'modalBg' && e.target !== t) return;
  if (t.tagName === 'BUTTON' || t.tagName === 'A') e.preventDefault();
  const fn = A[t.dataset.a]; if (fn) run(() => fn(t.dataset, t));
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-f]'); if (!f) return;
  e.preventDefault(); run(() => F[f.dataset.f](f));
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; $('#elist').innerHTML = elevesListHtml(); }
  if (t.classList.contains('fcm') && S.fiche) { const ev = S.fiche.evals[t.dataset.e] = S.fiche.evals[t.dataset.e] || {}; (ev[t.dataset.c] = ev[t.dataset.c] || {}).comment = t.value; saveDraft(); }
  if (t.classList.contains('fgc') && S.fiche) { S.fiche.commentaires[t.dataset.e] = t.value; saveDraft(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fMon' && S.fiche) { S.fiche.moniteurId = t.value; saveDraft(); render(); }
  if (t.id === 'fDate' && S.fiche) { S.fiche.date = t.value; saveDraft(); render(); }
  if (t.id === 'fSeance' && S.fiche) {
    const f = S.fiche, oldProg = progComps(f.seanceKey);
    f.seanceKey = t.value;
    if (f.mode === 'programme') {
      const hasData = c => f.eleves.some(el => { const x = (f.evals[el] || {})[c]; return x && (x.niveau || x.comment); });
      f.competences = [...progComps(f.seanceKey), ...f.competences.filter(c => !oldProg.includes(c) || hasData(c))].filter((c, i, a) => a.indexOf(c) === i);
    }
    saveDraft(); render();
  }
  if (t.classList.contains('fcomp') && S.fiche) {
    const f = S.fiche, id = t.dataset.id;
    f.competences = t.checked ? [...f.competences.filter(c => c !== id), id] : f.competences.filter(c => c !== id);
    saveDraft(); render();
  }
  if (t.classList.contains('seLabel')) {
    const SE = clone(seances()), s = SE.find(x => x.key === t.dataset.k);
    if (s && t.value.trim()) { s.label = t.value.trim(); run(() => saveProg({seances: SE})); }
  }
  if (t.id === 'xlsxFile') { const file = t.files[0]; t.value = ''; if (file) run(() => readXlsx(file)); }
  if (t.id === 'jsonFile') { const file = t.files[0]; t.value = ''; if (file) run(() => readJson(file)); }
});

/* ================= APPLICATION INSTALLABLE ================= */
let deferredPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canInstall = () => !isStandalone() && (!!deferredPrompt || isIOS());
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; requestRender(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('Application installée'); requestRender(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // Portée limitée à cette page : le dépôt héberge d'autres sites qui ont leur propre service worker.
  navigator.serviceWorker.register('./palanquee-sw.js?v=' + encodeURIComponent(APP_VERSION), {scope: './plongee-seances.html'}).then(reg => {
    const offer = w => { S.updateWorker = w; requestRender(); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
  }).catch(e => console.warn('Service worker :', e));
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
}

/* ================= DÉMARRAGE ================= */
(async () => {
  $('#app').innerHTML = '<main><div class="card muted">Chargement…</div></main>';
  try { await initBackend(); }
  catch (e) { $('#app').innerHTML = `<main><div class="card">Impossible de charger Firebase : ${esc(errMsg(e))}</div></main>`; return; }
  render();
  backend.onAuth(u => run(() => onAuthChange(u)));
})();
</script>
